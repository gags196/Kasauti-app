[project]
name = "kasauti-ingestion"
version = "0.1.0"
description = "PYQ scan ingestion pipeline: intake, vision extraction, segmentation, tagging, publish"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "boto3>=1.34",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyq_pipeline", "src/shared"]
