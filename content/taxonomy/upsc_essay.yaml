# UPSC CSE Mains — Paper-I, Essay.
#
# UPSC prescribes NO content syllabus for the Essay paper. The notification's entire
# statement is: "Candidates may be required to write essays on multiple topics. They
# will be expected to keep closely to the subject of the essay, to arrange their ideas
# in orderly fashion, and to write concisely. Credit will be given for effective and
# exact expression."
#
# So — unlike prelims-gs2 (CSAT), whose six bullets are transcribed verbatim from the
# notification — this tree is a purpose-built thematic scheme, derived by reading all
# essay topics 2013-2025. It exists only so the intelligence layer has something to
# rank/trend/recur against; it is founder-editable YAML and meant to be reshaped as the
# corpus grows. Two levels deep, matching the GS trees (branch = depth 1, leaf = depth 2).
exam:
  code: upsc-cse
  name_en: UPSC Civil Services Examination
  name_hi: संघ लोक सेवा आयोग सिविल सेवा परीक्षा

