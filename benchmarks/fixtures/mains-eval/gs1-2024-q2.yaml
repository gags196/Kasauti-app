rubric_id: gs1-2024-q2-subsidiary-alliance-v1
language: en

question: >-
  Evaluate the role of subsidiary alliance policy in turning 'the British Empire in India'
  into 'the British Empire of India'. (10 marks, 150 words)

answer: |
  Advent of British in India as a trading company & their withdrawal as a colonial power
  was possible because of their imperialist policies, one of the most important being —
  Subsidiary Alliance.

  Subsidiary Alliance:
  (1) This policy was put forward by Richard Wellesley
  (2) The states which signed Subsidiary Alliance Treaty could not have an army of their own
  (3) They had to station British army in their territory, which were to be maintained by
      the states themselves
  (4) The state could not have any independent foreign policy
  (5) They could not engage with Portuguese or French without permission of British
  (6) One British official was to be stationed in their court.

  Hyderabad, Bharatpur, Satara, Jaunpur and more states fell prey to this British policy
  of paramountcy.

  This was further extended by "Doctrine of Lapse" under Dalhousie, under which states
  that had signed Subsidiary Alliance were annexed on grounds of no biological heir /
  maladministration.

  Thus Subsidiary Alliance led to annexation of various territories & further led to
  expansion of British control & helped in establishing the British Empire.

