[project]
name = "kasauti"
version = "0.1.0"
description = "Kasauti — AI exam-prep platform for Indian government-exam aspirants. Delhi-grade preparation, wherever you are."
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/api", "ingestion"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerated migrations: don't fight the generator over line length
"**/migrations/versions/*" = ["E501"]
# FastAPI's Depends()/Query() in defaults is the framework idiom, not a bug
"**/api/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "ingestion/tests"]
asyncio_mode = "auto"
